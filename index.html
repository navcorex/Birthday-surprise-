<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Cutieee 🎂</title>
<style>
:root{--bg1:#ffd6e8;--bg2:#ffb3d1;--ink:#5a1033;--card:rgba(255,255,255,.75);--btn:#e8337a;--btnink:#fff;--pol:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a0a1c;--bg2:#4a1230;--ink:#ffe3ef;--card:rgba(255,255,255,.1);--btn:#ff5c9a;--btnink:#2a0a1c;--pol:#fff0f6;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2a0a1c;--bg2:#4a1230;--ink:#ffe3ef;--card:rgba(255,255,255,.1);--btn:#ff5c9a;--btnink:#2a0a1c;--pol:#fff0f6;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;overflow-x:hidden}
.s{display:none;padding:20px;max-width:420px;width:100%;animation:in .6s ease}
.s.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
h1{font-size:1.9rem;margin:.3em 0}
p{font-size:1.1rem;line-height:1.5}
.big{font-size:4.5rem;animation:b 1.2s infinite alternate}
@keyframes b{to{transform:translateY(-12px) rotate(6deg)}}
button{background:var(--btn);color:var(--btnink);border:0;border-radius:999px;padding:14px 30px;font-size:1.1rem;font-weight:700;margin-top:16px;box-shadow:0 6px 18px rgba(232,51,122,.4)}
.num{font-size:9rem;font-weight:900;color:var(--btn);animation:pop .9s infinite}
@keyframes pop{from{transform:scale(1.4);opacity:.3}to{transform:scale(1);opacity:1}}
.scr{position:relative;width:300px;max-width:100%;height:170px;margin:16px auto;border-radius:18px;overflow:hidden;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;line-height:1.5}
.scr canvas{position:absolute;inset:0;touch-action:none}
.pics{display:flex;justify-content:center;gap:12px;margin:6px 0 14px}
.pol{background:var(--pol);padding:6px 6px 20px;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.25);width:38%}
.pol img{width:100%;display:block;border-radius:3px}
.pol:nth-child(1){transform:rotate(-4deg)}.pol:nth-child(2){transform:rotate(4deg)}
.letter{background:var(--card);border-radius:16px;padding:16px;text-align:left;white-space:pre-wrap;font-size:1.05rem;line-height:1.6;min-height:240px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
#musicToggle{position:fixed;right:14px;top:14px;z-index:20;margin:0;padding:10px 15px;font-size:.9rem;background:rgba(232,51,122,.92);color:#fff;backdrop-filter:blur(8px)}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
function go(n){document.querySelectorAll('.s').forEach(e=>e.classList.remove('on'));$('s'+n).classList.add('on')}
const cv=$('fx'),x=cv.getContext('2d');let P=[],run=0;
function sz(){cv.width=innerWidth;cv.height=innerHeight}sz();addEventListener('resize',sz);
const cols=['#ff4d8d','#ffd166','#06d6a0','#4cc9f0','#b388ff','#fff'];
function fw(c){
  const ox=c?cv.width/2:Math.random()*cv.width*.8+cv.width*.1,oy=c?cv.height/3:Math.random()*cv.height*.4+40;
  const col=cols[Math.floor(Math.random()*6)];
  for(let i=0;i<70;i++){const a=Math.random()*6.283,s=c?Math.random()*12:Math.random()*5+1.5;
    P.push({x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(c?4:0),r:c?4:2.5,c:c?cols[i%6]:col,l:c?150:70+Math.random()*30})}
  if(!run){run=1;loop()}
}
function loop(){
  x.clearRect(0,0,cv.width,cv.height);
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.vx*=.99;p.l--;x.globalAlpha=Math.min(1,p.l/30);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()});
  x.globalAlpha=1;P=P.filter(p=>p.l>0);
  if(P.length)requestAnimationFrame(loop);else run=0;
}
function cd(){
  startMusic();
  go(2);let i=3;$('n').textContent=i;
  const t=setInterval(()=>{i--;if(i>0){$('n').textContent=i;return}
    clearInterval(t);go(3);let k=0;fw();const f=setInterval(()=>{fw();if(++k>7)clearInterval(f)},500)},1000);
}
const sc=$('sc'),g=sc.getContext('2d');
const gr=g.createLinearGradient(0,0,300,170);gr.addColorStop(0,'#e8337a');gr.addColorStop(1,'#ffb347');
g.fillStyle=gr;g.fillRect(0,0,300,170);g.fillStyle='#fff';g.font='bold 22px system-ui';g.textAlign='center';g.fillText('Ragdo yaha ✨',150,92);
let down=0,mv=0,done=0;
function sx(e){const r=sc.getBoundingClientRect();return[(e.clientX-r.left)*300/r.width,(e.clientY-r.top)*170/r.height]}
sc.addEventListener('pointerdown',e=>{down=1;sc.setPointerCapture(e.pointerId);dr(e)});
sc.addEventListener('pointerup',()=>down=0);
sc.addEventListener('pointermove',e=>{if(down)dr(e)});
function dr(e){
  const[a,b]=sx(e);g.globalCompositeOperation='destination-out';g.beginPath();g.arc(a,b,20,0,6.283);g.fill();
  if(!done&&++mv%8==0){const d=g.getImageData(0,0,300,170).data;let c=0,n=0;for(let i=3;i<d.length;i+=160){n++;if(d[i]==0)c++}
    if(c/n>.45){done=1;sc.style.transition='opacity .6s';sc.style.opacity=0;fw(1);$('nx').style.display='inline-block'}}
}

// Play the uploaded song after the visitor taps a button.
const bgMusic = new Audio('love.m4a');
bgMusic.loop = true;
bgMusic.volume = 0.65;
let musicOn = false;
async function startMusic(){
  try {
    await bgMusic.play();
    musicOn = true;
    $('musicToggle').textContent = '♫ Music: ON';
  } catch(e) {
    musicOn = false;
    $('musicToggle').textContent = '♫ Tap for music';
  }
}
function stopMusic(){
  bgMusic.pause();
  musicOn = false;
  $('musicToggle').textContent = '♫ Music: OFF';
}
function toggleMusic(){if(musicOn)stopMusic();else startMusic();}

const TXT="Hey Cutieee 🌸\n\nAaj tumhara birthday hai, aur lagta hai tumhe ye batane ka isse accha din nahi ho sakta.\n\nTumse baat karke mera din accha ho jata hai. Tumhari smile, tumhari baatein, sab kuch bahut pyaara lagta hai.\n\nMai tumhe pasand karta hu, bahut zyada. I love you 💖\n\nJawab ki koi jaldi nahi hai. Bas chahta tha ki tumhe pata ho.\n\nHappy Birthday! 🎂 Aaj full enjoy karna.";
function typ(){let i=0;const ch=[...TXT];const t=setInterval(()=>{$('lt').textContent+=ch[i++];if(i>=ch.length)clearInterval(t)},40)}
</script>
